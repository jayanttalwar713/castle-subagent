name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # No API key: simulation, scenarios and the fuzzer never touch the network.
      - run: pytest -q --cov=chatsched --cov-report=term
      - run: python -m chatsched compare --all

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # A deeper randomised soak than the default profile, on every push.
      - run: HYPOTHESIS_PROFILE=soak pytest tests/test_fuzz.py -q
